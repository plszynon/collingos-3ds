name: Build CollingOS 3DS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Install portlibs (curl, mbedtls, zlib)
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if dkp-pacman -Syu --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib; then ok=1; break; fi
            echo "pkg.devkitpro.org failed (attempt $i), retrying..."; sleep $((i*20))
          done
          if [ $ok -ne 1 ]; then
            dkp-pacman -S --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib
          fi
      - name: Get CA certificate bundle (for HTTPS)
        run: |
          if [ ! -s romfs/cacert.pem ]; then
            (command -v curl >/dev/null || (apt-get update && apt-get install -y curl ca-certificates))
            curl -L https://curl.se/ca/cacert.pem -o romfs/cacert.pem
          fi
          cp catalog/store.txt romfs/store.txt
      - name: Build
        run: make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: CollingOS-3DS
          path: |
            CollingOS.3dsx
            CollingOS.smdh
